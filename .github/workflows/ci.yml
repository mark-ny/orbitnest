name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -r backend/requirements.txt ruff pip-audit
      - run: pip-audit -r backend/requirements.txt
      - run: cd backend && ruff check . && ruff format --check .
      - run: python -m compileall -q backend/app backend/tests
      - run: cd backend && python -W error::ResourceWarning -m unittest discover -s tests -t .
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test frontend-tests/vt.test.mjs
  shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get install -y shellcheck
      - run: shellcheck scripts/install-linux.sh scripts/install-termux.sh scripts/orbitnest
