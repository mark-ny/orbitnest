# Nginx TLS reverse proxy for OrbitNest. Obtain certificates separately (certbot, acme.sh).
# Set in orbitnest.env:
#   ORBITNEST_PUBLIC_URL=https://nest.example.com
#   ORBITNEST_TRUSTED_PROXY=true
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name nest.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name nest.example.com;

    ssl_certificate     /etc/letsencrypt/live/nest.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nest.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000" always;
    server_tokens off;

    client_max_body_size 2g;
    proxy_request_buffering off;       # stream large uploads straight to OrbitNest

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append client-supplied values
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;           # terminal WebSocket
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
